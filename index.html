<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MASTER IP ULTRA</title>

<style>

body{
margin:0;
background:black;
color:lime;
font-family:monospace;
overflow:hidden;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

header{
text-align:center;
padding:15px;
border-bottom:1px solid lime;
background:#111;
}

.logo{
width:90px;
}

nav{
display:flex;
background:#111;
border-bottom:1px solid lime;
}

nav button{
flex:1;
padding:12px;
background:#111;
border:none;
color:lime;
font-weight:bold;
cursor:pointer;
}

nav button.active{
background:lime;
color:black;
}

section{
display:none;
padding:15px;
height:calc(100vh - 150px);
overflow-y:auto;
}

section.active{
display:block;
}

input,select,textarea{
width:95%;
padding:10px;
margin:8px 0;
background:#111;
color:lime;
border:1px solid lime;
}

button.action{
width:95%;
padding:12px;
background:lime;
border:none;
color:black;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.result{
margin-top:15px;
border:1px solid lime;
padding:10px;
}

.meter{
height:10px;
background:#222;
margin-top:5px;
}

.bar{
height:10px;
background:lime;
}

.terminal{
background:#000;
border:1px solid lime;
padding:10px;
font-size:12px;
margin-top:10px;
}

footer{
text-align:center;
padding:10px;
border-top:1px solid lime;
background:#111;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<header>

<img src="https://files.catbox.moe/u1npgd.jpg" class="logo">

<h2>MASTER IP ULTRA</h2>

<p>Cyber Report & Appeal Tool</p>

</header>

<nav>

<button class="tab-btn active" data-tab="report">REPORT</button>

<button class="tab-btn" data-tab="unban">UNBAN</button>

<button class="tab-btn" data-tab="help">HELP</button>

</nav>

<section id="report" class="active">

<h3>Report Account</h3>

<select id="country">
<option value="+263">Zimbabwe +263</option>
<option value="+27">South Africa +27</option>
<option value="+267">Botswana +267</option>
<option value="+44">UK +44</option>
<option value="+1">USA +1</option>
</select>

<input id="number" placeholder="Phone number">

<select id="violation">
<option value="1">Spam</option>
<option value="2">Harassment</option>
<option value="3">Threats</option>
<option value="4">Impersonation</option>
<option value="5">Scam</option>
<option value="6">Illegal Content</option>
<option value="7">Bullying</option>
</select>

<select id="frequency">
<option value="1">Once</option>
<option value="2">Multiple Times</option>
<option value="3">Daily</option>
</select>

<button class="action" onclick="analyze()">Analyze Case</button>

<div id="reportOutput" class="result"></div>

</section>

<section id="unban">

<h3>Unban Request</h3>

<input id="banNumber" placeholder="+263 number">

<select id="reasonTemplate">

<option>False report triggered ban</option>
<option>Technical error in system</option>
<option>Network error during update</option>
<option>Account hacked and misused</option>
<option>Automated spam detection mistake</option>
<option>Changed device recently</option>
<option>Did not violate policies</option>

</select>

<textarea id="banReason"></textarea>

<button class="action" onclick="generateUnban()">Generate Appeal</button>

<div id="unbanOutput" class="result"></div>

</section>

<section id="help">

<h3>Contact</h3>

<p>WhatsApp: +263779540058</p>

<p>Email: ipmastermaster6@gmail.com</p>

<p>Created by MASTER IP</p>

<div class="terminal">

SYSTEM STATUS<br>

Reports Generated: <span id="rCount">0</span><br>

Appeals Generated: <span id="aCount">0</span>

</div>

</section>

<footer>

MASTER IP ULTRA TOOL

</footer>

<script>

let reports=0
let appeals=0

const tabs=document.querySelectorAll(".tab-btn")
const sections=document.querySelectorAll("section")

tabs.forEach(btn=>{
btn.onclick=()=>{
tabs.forEach(b=>b.classList.remove("active"))
sections.forEach(s=>s.classList.remove("active"))
btn.classList.add("active")
document.getElementById(btn.dataset.tab).classList.add("active")
}
})

function analyze(){

let country=document.getElementById("country").value
let num=document.getElementById("number").value

let v=parseInt(document.getElementById("violation").value)
let f=parseInt(document.getElementById("frequency").value)

let score=v+f

let strength=score*15

if(strength>100)strength=100

let message=

"Dear WhatsApp Support,\n\n"+
"I would like to report the number "+country+num+
" for repeated violation of WhatsApp policies.\n"+
"This behaviour includes harassment or spam activity.\n\n"+
"Please review this account.\n\nThank you."

reports++

document.getElementById("rCount").innerText=reports

document.getElementById("reportOutput").innerHTML=

`
Case Strength: ${strength}%

<div class="meter">

<div class="bar" style="width:${strength}%"></div>

</div>

<div class="terminal">

[✓] scanning number<br>
[✓] checking violations<br>
[✓] preparing report<br>
[✓] ready

</div>

<button class="action" onclick="copyReport()">Copy Report</button>

<button class="action" onclick="sendAll('${message}')">
Send To All Emails
</button>
`

window.currentReport=message

}

function copyReport(){

navigator.clipboard.writeText(window.currentReport)

alert("Copied")

}

function sendAll(msg){

let subject="WhatsApp Policy Violation"

let body=encodeURIComponent(msg)

let emails="support@whatsapp.com,android@support.whatsapp.com,iphone@support.whatsapp.com"

window.location.href=`mailto:${emails}?subject=${subject}&body=${body}`

}

function generateUnban(){

let num=document.getElementById("banNumber").value

let reason=document.getElementById("banReason").value

let message=

"Hello WhatsApp Support,\n\n"+
"My number "+num+" was banned.\n"+
"Reason: "+reason+"\n\n"+
"I kindly request a review of my account.\n\nThank you."

appeals++

document.getElementById("aCount").innerText=appeals

document.getElementById("unbanOutput").innerHTML=

`
<textarea style="height:120px">${message}</textarea>

<button class="action" onclick="copyAppeal()">Copy Appeal</button>

<button class="action" onclick="sendAll('${message}')">
Send Appeal Emails
</button>
`

window.currentAppeal=message

}

function copyAppeal(){

navigator.clipboard.writeText(window.currentAppeal)

alert("Copied")

}

/* MATRIX BACKGROUND */

var c=document.getElementById("matrix")

var ctx=c.getContext("2d")

c.height=window.innerHeight
c.width=window.innerWidth

var letters="MASTERIP0123456789"

letters=letters.split("")

var font=14

var columns=c.width/font

var drops=[]

for(var x=0;x<columns;x++)drops[x]=1

function draw(){

ctx.fillStyle="rgba(0,0,0,0.05)"

ctx.fillRect(0,0,c.width,c.height)

ctx.fillStyle="#0F0"

ctx.font=font+"px monospace"

for(var i=0;i<drops.length;i++){

var text=letters[Math.floor(Math.random()*letters.length)]

ctx.fillText(text,i*font,drops[i]*font)

if(drops[i]*font>c.height&&Math.random()>0.975)drops[i]=0

drops[i]++

}

}

setInterval(draw,33)

</script>

</body>
</html>
