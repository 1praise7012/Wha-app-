<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER IP ULTRA PWA</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<style>
body {
  background:black;
  color:lime;
  font-family:monospace;
  text-align:center;
  padding:20px;
  margin:0;
}

header {
  margin-bottom:20px;
}

img.logo {
  width:150px;
  display:block;
  margin:10px auto;
}

h1 { margin:10px 0; }
p { font-size:1.1em; }

.container {
  max-width:500px;
  margin:auto;
}

input, select, textarea {
  width:90%;
  padding:10px;
  margin:8px 0;
  background:#111;
  color:lime;
  border:1px solid lime;
  border-radius:4px;
}

button {
  padding:12px 20px;
  margin:10px;
  background:lime;
  color:black;
  font-weight:bold;
  border:none;
  cursor:pointer;
  border-radius:5px;
}

button:hover {
  background:#a0ff00;
}

.result {
  margin-top:20px;
  padding:15px;
  border:1px solid lime;
  border-radius:5px;
}

footer {
  margin-top:20px;
}
</style>
</head>

<body>
<header>
<img src="https://files.catbox.moe/u1npgd.jpg" alt="MASTER IP Logo" class="logo">
<h1>MASTER IP ULTRA PWA 🚀</h1>
<p>Cyber Safety & Reporting System</p>
</header>

<div class="container">
<h2>Report a Violation</h2>
<input type="text" id="number" placeholder="Enter Phone Number (+263...)">

<select id="violation">
  <option value="0">Select Violation Type</option>
  <option value="1">Spam Messages</option>
  <option value="2">Harassment</option>
  <option value="3">Threats</option>
  <option value="4">Impersonation</option>
</select>

<select id="frequency">
  <option value="0">How Often?</option>
  <option value="1">Once</option>
  <option value="2">Multiple Times</option>
  <option value="3">Daily</option>
</select>

<button onclick="analyze()">Analyze Case</button>

<h2>Request Account Unban</h2>
<input type="text" id="banNumber" placeholder="Enter Your Banned Phone Number (+263...)">
<textarea id="banReason" placeholder="Explain why your account should be unbanned"></textarea>
<button onclick="requestUnban()">Generate Unban Email</button>

<div id="output" class="result"></div>
</div>

<script>
// Smart Analyzer
function analyze() {
  let number = document.getElementById("number").value.trim();
  let violation = parseInt(document.getElementById("violation").value);
  let frequency = parseInt(document.getElementById("frequency").value);

  if(!number || violation === 0 || frequency === 0){
    alert("Please fill all fields to analyze.");
    return;
  }

  let score = violation + frequency;
  let recommendation = "";

  if(score <= 2){
    recommendation = "⚠ Low Risk: Consider blocking the user.";
  } else if(score <= 4){
    recommendation = "⚠ Medium Risk: Report inside WhatsApp.";
  } else {
    recommendation = "🚨 High Risk: Prepare formal complaint to WhatsApp Support.";
  }

  document.getElementById("output").innerHTML = `
    <h3>Analysis Result</h3>
    <p>Risk Score: ${score}</p>
    <p>${recommendation}</p>
    <button onclick="generateEmail('${number}')">Generate Support Email</button>
  `;
}

// Generate pre-filled email for reporting
function generateEmail(number){
  let subject = "Report WhatsApp Policy Violation";
  let body = "Hello WhatsApp Support,%0D%0A%0D%0AI would like to report the number " 
             + number + 
             " for violating WhatsApp policies.%0D%0APlease review this case.%0D%0A%0D%0AThank you.";

  window.location.href = `mailto:support@whatsapp.com?subject=${subject}&body=${body}`;
}

// Generate pre-filled email for unban requests (smarter)
function requestUnban(){
  let number = document.getElementById("banNumber").value.trim();
  let reason = document.getElementById("banReason").value.trim();

  if(!number || !reason){
    alert("Please enter your phone number and reason for unban.");
    return;
  }

  // Optional: simple verification logic
  if(reason.length < 20){
    alert("Please provide more details about why your account should be unbanned (at least 20 characters).");
    return;
  }

  let subject = "Request for Account Unban";
  let body = "Hello WhatsApp Support,%0D%0A%0D%0AI am submitting a request to review my WhatsApp account (" 
             + number + 
             ") which has been banned.%0D%0AReason for unban: " + reason +
             "%0D%0A%0D%0APlease kindly review and unban my account if possible.%0D%0A%0D%0AThank you.";

  window.location.href = `mailto:support@whatsapp.com?subject=${subject}&body=${body}`;
}

// Service Worker registration for offline support
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('Service Worker Registered', reg))
      .catch(err => console.log('Service Worker Failed', err));
  });
}
</script>

<footer>
<p>Created by MASTER IP</p>
</footer>
</body>
</html>
